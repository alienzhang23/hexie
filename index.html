<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用文明用语，创建和谐社会</title>
  <style>
    :root {
      --bg: #F7F5F2;
      --card: #FFFFFF;
      --line: #E8E3DC;
      --ink: #221F1C;
      --muted: #8A827A;
      --faint: #B8AFA5;
      --accent: #B03A2E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }
    h1 {
      font-size: clamp(22px, 3.6vw, 31px);
      font-weight: 600;
      letter-spacing: .3px;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 8px;
    }
    .tabs {
      display: flex;
      gap: 26px;
      margin: 30px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      background: none;
      border: none;
      padding: 0 0 12px;
      cursor: pointer;
      font: inherit;
      font-size: 14.5px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .18s, border-color .18s;
    }
    .tab:hover { color: var(--ink); }
    .tab.on {
      color: var(--ink);
      border-color: var(--ink);
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 18px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 17px;
      font-size: 13px;
      cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
    }
    .chip:hover {
      border-color: #CFC7BD;
      color: var(--ink);
    }
    .chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px 28px 24px;
      box-shadow: 0 1px 2px rgba(60,45,30,.03);
    }
    .card-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    @media (max-width: 640px) {
      .card-split { grid-template-columns: 1fr; }
    }
    .side {
      padding: 8px 12px;
    }
    .side + .side {
      border-left: 1px solid var(--line);
    }
    @media (max-width: 640px) {
      .side + .side {
        border-left: none;
        border-top: 1px solid var(--line);
        margin-top: 16px;
        padding-top: 20px;
      }
    }
    .label {
      font-size: 11px;
      letter-spacing: 1.2px;
      color: var(--faint);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .main-text {
      font-size: clamp(20px, 3.2vw, 26px);
      font-weight: 500;
      line-height: 1.55;
      margin: 0 0 8px;
      word-break: break-word;
    }
    .meta {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.6;
    }
    .level-tag {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    .level-tag span {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 3px;
      opacity: .35;
    }
    .level-tag span.on { opacity: 1; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: var(--ink);
      color: #fff;
      flex: 1;
      min-width: 140px;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover { border-color: #CFC7BD; }
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    .kbd {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 11px;
      background: #fff;
      margin: 0 2px;
    }
    .disclaimer {
      margin-top: 36px;
      font-size: 12.5px;
      color: var(--faint);
      line-height: 1.7;
      text-align: center;
    }
    /* 转换器区域 */
    .converter {
      display: none;
    }
    .converter.on { display: block; }
    .random-panel { display: block; }
    .random-panel.off { display: none; }
    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .18s;
    }
    textarea:focus { border-color: #CFC7BD; }
    .result-box {
      margin-top: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      font-size: 17px;
      line-height: 1.7;
      min-height: 80px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .opts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 6px;
      align-items: center;
    }
    .opts label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 99;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>使用文明用语，创建和谐社会</h1>
    <p class="sub">把脏话换成谐音字，让平台检测系统稍微歇一会儿。</p>
    <p class="sub" style="margin-bottom:0">仅供语言自娱与技术研究。真正想骂人时，对方听到的永远是原意。</p>

    <div class="tabs">
      <button class="tab on" data-tab="random">随机一句</button>
      <button class="tab" data-tab="convert">实时转换</button>
    </div>

    <!-- 随机一句面板 -->
    <div class="random-panel" id="panel-random">
      <div class="filters" id="level-filters">
        <button class="chip on" data-lv="0">全部</button>
        <button class="chip" data-lv="1">轻度</button>
        <button class="chip" data-lv="2">中度</button>
        <button class="chip" data-lv="3">重度</button>
      </div>

      <div class="card" id="card">
        <div class="level-tag" id="level-tag">轻度 <span class="on"></span><span></span><span></span></div>
        <div class="card-split">
          <div class="side">
            <div class="label">谐音版（可复制）</div>
            <p class="main-text" id="safe-text">草泥马</p>
          </div>
          <div class="side">
            <div class="label">原意</div>
            <p class="main-text" id="orig-text" style="color:var(--muted);font-size:clamp(16px,2.6vw,20px)">操你妈</p>
          </div>
        </div>
        <div class="meta" id="op-text">原词 → 谐音：操 → 草 ；妈 → 马</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-roll">换一句</button>
        <button class="btn btn-ghost" id="btn-copy">复制谐音版</button>
      </div>
      <div class="footer-info">
        <span id="counter">已浏览 0 / 0 句</span>
        <span><span class="kbd">空格</span> 换句 &nbsp; <span class="kbd">C</span> 复制</span>
      </div>
    </div>

    <!-- 实时转换面板 -->
    <div class="converter" id="panel-convert">
      <div class="card" style="padding:24px 22px">
        <div class="label" style="margin-bottom:12px">输入原文（含脏话）</div>
        <textarea id="input-text" placeholder="在这里粘贴或输入要转换的文字，例如：你这个傻逼，去你妈的……"></textarea>

        <div class="opts">
          <label><input type="checkbox" id="opt-random" checked> 随机选择谐音变体</label>
          <label><input type="checkbox" id="opt-keep" checked> 保留原标点与空格</label>
        </div>

        <div class="label" style="margin:18px 0 10px">转换结果</div>
        <div class="result-box" id="result-box">转换结果会显示在这里</div>

        <div class="actions" style="margin-top:16px">
          <button class="btn btn-primary" id="btn-convert">立即转换</button>
          <button class="btn btn-ghost" id="btn-copy-result">复制结果</button>
        </div>
      </div>
    </div>

    <p class="disclaimer">
      仅供语言学习与自娱。这类谐音存在的意义就是留一条「我可没骂人」的后路。<br>
      平台检测规则会不断更新，任何替换都无法保证 100% 通过。请为自己的言论负责。
    </p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ==================== 谐音词典 ==================== */
    // 每个敏感词对应一组可替换的谐音/形近/变体
    const DICT = {
      "操": ["草", "艹", "曹", "糙", "肏"],
      "妈": ["马", "麻", "码", "玛", "吗"],
      "逼": ["比", "币", "B", "逼", "闭"],
      "傻逼": ["傻B", "沙比", "煞笔", "傻比", "沙币", "sb", "SB"],
      "你妈": ["你马", "尼玛", "你麻", "泥马", "nima"],
      "他妈": ["他马", "特么", "他妈", "tama"],
      "妈的": ["马的", "麻的", "码的"],
      "滚蛋": ["滚蛋", "滚单", "衮蛋"],
      "去死": ["去4", "去撕", "去死"],
      "死": ["4", "撕", "si"],
      "日": ["曰", "ri", "R"],
      "艹": ["草", "曹", "操"],
      "靠": ["尻", "烤", "考"],
      "屁": ["批", "pi"],
      "蛋": ["弹", "单"],
      "屎": ["shi", "史", "使"],
      "尿": ["niao", "鸟"],
      "鸡巴": ["鸡吧", "几把", "jiba", "JB"],
      "鸡鸡": ["几几", "jiji"],
      "屌": ["吊", "diao", "鸟"],
      "肏": ["操", "草", "艹"],
      "杂种": ["杂仲", "砸种"],
      "畜生": ["畜牲", "触生"],
      "贱人": ["贱忍", "见人"],
      "婊子": ["表子", "裱子"],
      "狗日": ["狗ri", "苟日"],
      "草泥马": ["草泥马", "草泥瑪", "艹泥马"],
      "卧槽": ["我草", "卧艹", "沃槽", "wocao"],
      "我靠": ["我尻", "我烤"],
      "尼玛": ["你马", "泥马", "nima"],
      "特么": ["特么", "特马", "他妈"],
      "妈卖批": ["马卖比", "麻卖B", "码卖币"],
      "傻叉": ["傻X", "沙叉", "煞叉"],
      "脑残": ["脑参", "nao残"],
      "智障": ["智帐", "致障"],
      "废物": ["废物", "费物"],
      "垃圾": ["拉极", "laji", "垃计"]
    };

    // 预置随机句子（谐音版 + 原意 + 说明 + 强度）
    const DATA = [
      // 轻度 lv:1
      { safe: "草泥马", orig: "操你妈", op: "操 → 草 ；妈 → 马", lv: 1 },
      { safe: "去你马的", orig: "去你妈的", op: "妈 → 马", lv: 1 },
      { safe: "傻B", orig: "傻逼", op: "逼 → B", lv: 1 },
      { safe: "沙比", orig: "傻逼", op: "傻 → 沙 ；逼 → 比", lv: 1 },
      { safe: "尼玛", orig: "你妈", op: "你妈 → 尼玛", lv: 1 },
      { safe: "特么的", orig: "他妈的", op: "他妈 → 特么", lv: 1 },
      { safe: "卧艹", orig: "卧槽", op: "槽 → 艹", lv: 1 },
      { safe: "我尻", orig: "我靠", op: "靠 → 尻", lv: 1 },
      { safe: "滚蛋", orig: "滚蛋", op: "蛋 → 蛋（同形）/ 单", lv: 1 },
      { safe: "去4", orig: "去死", op: "死 → 4", lv: 1 },
      { safe: "草你马", orig: "操你妈", op: "操 → 草 ；妈 → 马", lv: 1 },
      { safe: "傻比一个", orig: "傻逼一个", op: "逼 → 比", lv: 1 },
      { safe: "你这个沙币", orig: "你这个傻逼", op: "傻 → 沙 ；逼 → 币", lv: 1 },
      { safe: "麻痹的", orig: "妈逼的", op: "妈 → 麻 ；逼 → 痹", lv: 1 },
      { safe: "日了狗了", orig: "日了狗了", op: "日 保留（平台有时不拦）", lv: 1 },

      // 中度 lv:2
      { safe: "草你马的逼", orig: "操你妈的逼", op: "操 → 草 ；妈 → 马", lv: 2 },
      { safe: "你马卖批", orig: "你妈卖批", op: "妈 → 马 ；批 保留", lv: 2 },
      { safe: "去你马的傻B", orig: "去你妈的傻逼", op: "妈 → 马 ；逼 → B", lv: 2 },
      { safe: "特么的智障", orig: "他妈的智障", op: "他妈 → 特么", lv: 2 },
      { safe: "卧艹你这个沙比", orig: "卧槽你这个傻逼", op: "槽 → 艹 ；傻 → 沙 ；逼 → 比", lv: 2 },
      { safe: "滚你马的蛋", orig: "滚你妈的蛋", op: "妈 → 马", lv: 2 },
      { safe: "你这个脑参", orig: "你这个脑残", op: "残 → 参", lv: 2 },
      { safe: "草泥马的傻叉", orig: "操你妈的傻叉", op: "操 → 草 ；妈 → 马", lv: 2 },
      { safe: "尼玛的废物", orig: "你妈的废物", op: "你妈 → 尼玛", lv: 2 },
      { safe: "我草你马", orig: "我操你妈", op: "操 → 草 ；妈 → 马", lv: 2 },
      { safe: "日你仙人", orig: "日你仙人", op: "经典台湾谐音用法", lv: 2 },
      { safe: "你马的几把", orig: "你妈的鸡巴", op: "妈 → 马 ；鸡巴 → 几把", lv: 2 },
      { safe: "沙比玩意儿", orig: "傻逼玩意儿", op: "傻 → 沙 ；逼 → 比", lv: 2 },
      { safe: "艹尼玛", orig: "操你妈", op: "操 → 艹 ；你妈 → 尼玛", lv: 2 },
      { safe: "特么智帐", orig: "他妈智障", op: "他妈 → 特么 ；障 → 帐", lv: 2 },

      // 重度 lv:3
      { safe: "草泥马逼", orig: "操你妈逼", op: "操 → 草 ；妈 → 马", lv: 3 },
      { safe: "去你马卖批", orig: "去你妈卖批", op: "妈 → 马", lv: 3 },
      { safe: "我草你马的傻B", orig: "我操你妈的傻逼", op: "操 → 草 ；妈 → 马 ；逼 → B", lv: 3 },
      { safe: "尼玛的几把玩意", orig: "你妈的鸡巴玩意", op: "你妈 → 尼玛 ；鸡巴 → 几把", lv: 3 },
      { safe: "卧艹你这个脑参沙比", orig: "卧槽你这个脑残傻逼", op: "多重替换", lv: 3 },
      { safe: "草你马的臭沙币", orig: "操你妈的臭傻逼", op: "操 → 草 ；妈 → 马 ；傻 → 沙 ；逼 → 币", lv: 3 },
      { safe: "特么的狗日的", orig: "他妈的狗日的", op: "他妈 → 特么", lv: 3 },
      { safe: "你马的劳资草死你", orig: "你妈的劳资操死你", op: "妈 → 马 ；操 → 草", lv: 3 },
      { safe: "艹你马卖批的", orig: "操你妈卖批的", op: "操 → 艹 ；妈 → 马", lv: 3 },
      { safe: "沙比尼玛的", orig: "傻逼你妈的", op: "傻 → 沙 ；逼 → 比 ；你妈 → 尼玛", lv: 3 },
      { safe: "我日你仙人板板", orig: "我日你仙人板板", op: "经典加强版", lv: 3 },
      { safe: "草泥马的几把毛", orig: "操你妈的鸡巴毛", op: "操 → 草 ；妈 → 马 ；鸡巴 → 几把", lv: 3 },
      { safe: "去你马的臭表子", orig: "去你妈的臭婊子", op: "妈 → 马 ；婊 → 表", lv: 3 },
      { safe: "特么的畜生不如", orig: "他妈的畜生不如", op: "他妈 → 特么", lv: 3 },
      { safe: "尼玛逼的智帐", orig: "你妈逼的智障", op: "你妈 → 尼玛 ；障 → 帐", lv: 3 }
    ];

    /* ==================== 工具函数 ==================== */
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      }
    }

    /* ==================== 随机一句逻辑 ==================== */
    let currentLv = 0;
    let pool = [];
    let idx = 0;
    let viewed = new Set();

    function rebuildPool() {
      pool = currentLv === 0 ? DATA.slice() : DATA.filter(d => d.lv === currentLv);
      // 打乱
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      idx = 0;
      viewed.clear();
    }

    function renderLevelTag(lv) {
      const names = { 1: "轻度", 2: "中度", 3: "重度" };
      const dots = [1, 2, 3].map(i => `<span class="${i <= lv ? "on" : ""}"></span>`).join("");
      document.getElementById("level-tag").innerHTML = `${names[lv] || ""} ${dots}`;
    }

    function showCurrent() {
      if (!pool.length) return;
      const item = pool[idx % pool.length];
      document.getElementById("safe-text").textContent = item.safe;
      document.getElementById("orig-text").textContent = item.orig;
      document.getElementById("op-text").textContent = "原词 → 谐音：" + item.op;
      renderLevelTag(item.lv);
      viewed.add(item.safe + item.orig);
      document.getElementById("counter").textContent = `已浏览 ${viewed.size} / ${pool.length} 句`;
    }

    function roll() {
      if (!pool.length) rebuildPool();
      idx = (idx + 1) % pool.length;
      showCurrent();
    }

    /* ==================== 实时转换逻辑 ==================== */
    function convertText(raw, randomPick = true) {
      if (!raw.trim()) return "";

      // 按长度降序，优先匹配长词
      const keys = Object.keys(DICT).sort((a, b) => b.length - a.length);
      let result = raw;

      for (const key of keys) {
        const variants = DICT[key];
        if (!variants || !variants.length) continue;
        const re = new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        result = result.replace(re, () => {
          if (randomPick) {
            return variants[Math.floor(Math.random() * variants.length)];
          }
          return variants[0];
        });
      }
      return result;
    }

    /* ==================== 事件绑定 ==================== */
    // Tab 切换
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
        tab.classList.add("on");
        const name = tab.dataset.tab;
        document.getElementById("panel-random").classList.toggle("off", name !== "random");
        document.getElementById("panel-convert").classList.toggle("on", name === "convert");
      });
    });

    // 强度筛选
    document.getElementById("level-filters").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      chip.classList.add("on");
      currentLv = +chip.dataset.lv;
      rebuildPool();
      showCurrent();
    });

    document.getElementById("btn-roll").addEventListener("click", roll);
    document.getElementById("btn-copy").addEventListener("click", async () => {
      const text = document.getElementById("safe-text").textContent;
      const ok = await copyText(text);
      toast(ok ? "已复制：" + text : "复制失败，请手动选择");
    });

    document.getElementById("btn-convert").addEventListener("click", () => {
      const raw = document.getElementById("input-text").value;
      const random = document.getElementById("opt-random").checked;
      const result = convertText(raw, random);
      document.getElementById("result-box").textContent = result || "（无内容）";
    });

    document.getElementById("btn-copy-result").addEventListener("click", async () => {
      const text = document.getElementById("result-box").textContent;
      if (!text || text === "转换结果会显示在这里" || text === "（无内容）") {
        toast("没有可复制的内容");
        return;
      }
      const ok = await copyText(text);
      toast(ok ? "已复制结果" : "复制失败");
    });

    // 输入时实时转换（可选体验）
    let convertTimer;
    document.getElementById("input-text").addEventListener("input", () => {
      clearTimeout(convertTimer);
      convertTimer = setTimeout(() => {
        document.getElementById("btn-convert").click();
      }, 280);
    });

    // 键盘快捷键（仅在随机页）
    document.addEventListener("keydown", e => {
      if (document.getElementById("panel-convert").classList.contains("on")) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.code === "Space") {
        e.preventDefault();
        roll();
      }
      if (e.key === "c" || e.key === "C") {
        document.getElementById("btn-copy").click();
      }
    });

    // 初始化
    rebuildPool();
    showCurrent();
  </script>
</body>
</html>
