<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用文明用语，创建和谐社会</title>
  <style>
    :root {
      --bg: #F7F5F2;
      --card: #FFFFFF;
      --line: #E8E3DC;
      --ink: #221F1C;
      --muted: #8A827A;
      --faint: #B8AFA5;
      --accent: #B03A2E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }
    h1 {
      font-size: clamp(22px, 3.6vw, 31px);
      font-weight: 600;
      letter-spacing: .3px;
      line-height: 1.4;
      margin: 0 0 12px;
    }
    .sub {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 8px;
    }
    .tabs {
      display: flex;
      gap: 26px;
      margin: 30px 0 22px;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      background: none;
      border: none;
      padding: 0 0 12px;
      cursor: pointer;
      font: inherit;
      font-size: 14.5px;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .18s, border-color .18s;
    }
    .tab:hover { color: var(--ink); }
    .tab.on {
      color: var(--ink);
      border-color: var(--ink);
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 18px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 17px;
      font-size: 13px;
      cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
    }
    .chip:hover {
      border-color: #CFC7BD;
      color: var(--ink);
    }
    .chip.on {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 32px 28px 24px;
      box-shadow: 0 1px 2px rgba(60,45,30,.03);
    }
    .card-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    @media (max-width: 640px) {
      .card-split { grid-template-columns: 1fr; }
    }
    .side {
      padding: 8px 12px;
    }
    .side + .side {
      border-left: 1px solid var(--line);
    }
    @media (max-width: 640px) {
      .side + .side {
        border-left: none;
        border-top: 1px solid var(--line);
        margin-top: 16px;
        padding-top: 20px;
      }
    }
    .label {
      font-size: 11px;
      letter-spacing: 1.2px;
      color: var(--faint);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .main-text {
      font-size: clamp(20px, 3.2vw, 26px);
      font-weight: 500;
      line-height: 1.55;
      margin: 0 0 8px;
      word-break: break-word;
    }
    .meta {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.6;
    }
    .level-tag {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 12px;
      color: var(--muted);
    }
    .level-tag span {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 3px;
      opacity: .35;
    }
    .level-tag span.on { opacity: 1; }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: var(--ink);
      color: #fff;
      flex: 1;
      min-width: 140px;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover { border-color: #CFC7BD; }
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    .kbd {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 11px;
      background: #fff;
      margin: 0 2px;
    }
    .disclaimer {
      margin-top: 36px;
      font-size: 12.5px;
      color: var(--faint);
      line-height: 1.7;
      text-align: center;
    }
    /* 转换器区域 */
    .converter {
      display: none;
    }
    .converter.on { display: block; }
    .random-panel { display: block; }
    .random-panel.off { display: none; }
    textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .18s;
    }
    textarea:focus { border-color: #CFC7BD; }
    .result-box {
      margin-top: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      font-size: 17px;
      line-height: 1.7;
      min-height: 80px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .opts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 6px;
      align-items: center;
    }
    .opts label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 13.5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 99;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>使用文明用语，创建和谐社会</h1>
    <p class="sub">用常见形近字把脏话换掉，不用繁体、不用生僻字，平台不一定拦得住，人一看就懂。</p>
    <p class="sub" style="margin-bottom:0">仅供语言自娱。这类写法存在的意义就是留一条「我可没骂人」的后路，对着真人用的时候，对方看到的永远是原意。</p>

    <div class="tabs">
      <button class="tab on" data-tab="random">随机一句</button>
      <button class="tab" data-tab="convert">实时转换</button>
    </div>

    <!-- 随机一句面板 -->
    <div class="random-panel" id="panel-random">
      <div class="filters" id="level-filters">
        <button class="chip on" data-lv="0">全部</button>
        <button class="chip" data-lv="2">大杯</button>
        <button class="chip" data-lv="3">特大杯</button>
        <label style="margin-left:8px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="opt-zw-random" checked> 插入零宽字符
        </label>
      </div>

      <div class="card" id="card">
        <div class="level-tag" id="level-tag">大杯 <span></span><span class="on"></span><span></span></div>
        <div class="card-split">
          <div class="side">
            <div class="label">形近版（可复制）</div>
            <p class="main-text" id="safe-text">草泥马</p>
          </div>
          <div class="side">
            <div class="label">原意</div>
            <p class="main-text" id="orig-text" style="color:var(--muted);font-size:clamp(16px,2.6vw,20px)">操你妈</p>
          </div>
        </div>
        <div class="meta" id="op-text">原词 → 形近：操 → 草 ；妈 → 马</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-roll">换一句</button>
        <button class="btn btn-ghost" id="btn-copy">复制谐音版</button>
      </div>
      <div class="footer-info">
        <span id="counter">已浏览 0 / 0 句</span>
        <span><span class="kbd">空格</span> 换句 &nbsp; <span class="kbd">C</span> 复制</span>
      </div>
    </div>

    <!-- 实时转换面板 -->
    <div class="converter" id="panel-convert">
      <div class="card" style="padding:24px 22px">
        <div class="label" style="margin-bottom:12px">输入原文（含脏话）</div>
        <textarea id="input-text" placeholder="在这里粘贴或输入要转换的文字，例如：操你妈的傻逼，操你全家……"></textarea>

        <div class="opts">
          <label><input type="checkbox" id="opt-random" checked> 随机选择形近变体</label>
          <label><input type="checkbox" id="opt-zw" checked> 插入零宽字符</label>
          <label><input type="checkbox" id="opt-keep" checked> 保留原标点与空格</label>
        </div>

        <div class="label" style="margin:18px 0 10px">转换结果</div>
        <div class="result-box" id="result-box">转换结果会显示在这里</div>

        <div class="actions" style="margin-top:16px">
          <button class="btn btn-primary" id="btn-convert">立即转换</button>
          <button class="btn btn-ghost" id="btn-copy-result">复制结果</button>
        </div>
      </div>
    </div>

    <p class="disclaimer">
      仅供语言学习与自娱。这类形近字写法存在的意义就是留一条「我可没骂人」的后路。<br>
      平台检测规则会不断更新，任何替换都无法保证 100% 通过。请为自己的言论负责。
    </p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ==================== 形近字替换词典（简体 + 常见形近，不用繁体/生僻） ==================== */
    const DICT = {
      "操": ["草", "曹", "槽", "糙", "搓"],
      "妈": ["马", "麻", "码", "吗", "玛"],
      "逼": ["比", "币", "B", "闭", "臂"],
      "傻逼": ["傻B", "沙比", "煞笔", "傻比", "沙币"],
      "你妈": ["你马", "尼玛", "你麻", "泥马", "你码"],
      "他妈": ["他马", "特么", "他麻", "特马"],
      "鸡巴": ["几把", "鸡吧", "几巴", "JB", "jiba"],
      "屌": ["吊", "鸟", "屌"],
      "日": ["曰", "ri", "R"],
      "死": ["4", "撕", "si"],
      "狗": ["苟", "勾", "够", "狗"],
      "全家": ["全家", "全架", "全加"],
      "婊子": ["表子", "裱子", "表仔"],
      "杂种": ["杂仲", "砸种", "杂钟"],
      "畜生": ["畜牲", "触生", "畜生"],
      "脑残": ["脑参", "脑残", "nao残"],
      "智障": ["智帐", "致障", "智章"],
      "废物": ["废五", "费物", "废武"],
      "滚": ["衮", "辊", "滚"],
      "妈的": ["马的", "麻的", "码的"],
      "你妈的": ["你马的", "尼玛的", "你麻的"],
      "操你妈": ["草你马", "曹尼玛", "槽你麻", "搓你码"],
      "操你全家": ["草你全家", "曹你全架", "槽你全加"],
      "去你妈的": ["去你马的", "去尼玛的", "去你麻的"],
      "妈卖批": ["马卖比", "麻卖B", "码卖币"],
      "卧槽": ["我草", "卧曹", "沃槽", "我糙"],
      "我靠": ["我尻", "我烤", "我靠"],
      "狗日": ["苟曰", "勾日", "够曰"],
      "日你": ["曰你", "ri你"]
    };

    // 预置句子：大杯 / 特大杯，全部简体形近字，力度保留
    const DATA = [
      // 大杯 lv:2
      { safe: "草你马的比", orig: "操你妈的逼", op: "操 → 草 ；妈 → 马 ；逼 → 比", lv: 2 },
      { safe: "去你马的傻B", orig: "去你妈的傻逼", op: "妈 → 马 ；逼 → B", lv: 2 },
      { safe: "曹尼玛的几把", orig: "操你妈的鸡巴", op: "操 → 曹 ；你妈 → 尼玛 ；鸡巴 → 几把", lv: 2 },
      { safe: "我曰你仙人", orig: "我日你仙人", op: "日 → 曰（形近）", lv: 2 },
      { safe: "特么的苟曰的", orig: "他妈的狗日的", op: "他妈 → 特么 ；狗 → 苟 ；日 → 曰", lv: 2 },
      { safe: "你这个沙比玩意儿", orig: "你这个傻逼玩意儿", op: "傻 → 沙 ；逼 → 比", lv: 2 },
      { safe: "衮你马的蛋", orig: "滚你妈的蛋", op: "滚 → 衮 ；妈 → 马", lv: 2 },
      { safe: "尼玛的废五", orig: "你妈的废物", op: "你妈 → 尼玛 ；废物 → 废五", lv: 2 },
      { safe: "草你全家", orig: "操你全家", op: "操 → 草", lv: 2 },
      { safe: "我草你这个脑参", orig: "卧槽你这个脑残", op: "卧槽 → 我草 ；残 → 参", lv: 2 },
      { safe: "去你麻的臭表子", orig: "去你妈的臭婊子", op: "妈 → 麻 ；婊 → 表", lv: 2 },
      { safe: "我槽你马", orig: "我操你妈", op: "操 → 槽 ；妈 → 马", lv: 2 },
      { safe: "你马卖比", orig: "你妈卖批", op: "妈 → 马 ；批 → 比", lv: 2 },
      { safe: "沙比尼玛的", orig: "傻逼你妈的", op: "傻 → 沙 ；逼 → 比 ；你妈 → 尼玛", lv: 2 },
      { safe: "曰了苟了你", orig: "日了狗了你", op: "日 → 曰 ；狗 → 苟", lv: 2 },
      { safe: "你这个智帐", orig: "你这个智障", op: "障 → 帐（形近）", lv: 2 },
      { safe: "草你马的臭比", orig: "操你妈的臭逼", op: "操 → 草 ；妈 → 马 ；逼 → 比", lv: 2 },
      { safe: "我尻你这个杂仲", orig: "我靠你这个杂种", op: "靠 → 尻 ；种 → 仲", lv: 2 },

      // 特大杯 lv:3
      { safe: "草你马的比，你这个傻B", orig: "操你妈的逼，你这个傻逼", op: "操 → 草 ；妈 → 马 ；逼 → 比/B", lv: 3 },
      { safe: "去你马的，草你全家", orig: "去你妈的，操你全家", op: "妈 → 马 ；操 → 草", lv: 3 },
      { safe: "我曹尼玛的几把毛", orig: "我操你妈的鸡巴毛", op: "操 → 曹 ；你妈 → 尼玛 ；鸡巴 → 几把", lv: 3 },
      { safe: "你这个苟曰的沙比，衮远点", orig: "你这个狗日的傻逼，滚远点", op: "狗 → 苟 ；日 → 曰 ；傻 → 沙 ；逼 → 比 ；滚 → 衮", lv: 3 },
      { safe: "草你马卖比的，智帐一个", orig: "操你妈卖批的，智障一个", op: "操 → 草 ；妈 → 马 ；批 → 比 ；障 → 帐", lv: 3 },
      { safe: "我草，你全家都是畜牲", orig: "卧槽，你全家都是畜生", op: "卧槽 → 我草 ；畜生 → 畜牲", lv: 3 },
      { safe: "我曰你仙人板板，沙比", orig: "我日你仙人板板，傻逼", op: "日 → 曰 ；傻 → 沙 ；逼 → 比", lv: 3 },
      { safe: "去你麻的臭表子，草你全架", orig: "去你妈的臭婊子，操你全家", op: "妈 → 麻 ；婊 → 表 ；操 → 草 ；全家 → 全架", lv: 3 },
      { safe: "你马的几把被车轧了", orig: "你妈的鸡巴被车轧了", op: "妈 → 马 ；鸡巴 → 几把", lv: 3 },
      { safe: "槽你马的比，脑参傻B", orig: "操你妈的逼，脑残傻逼", op: "操 → 槽 ；妈 → 马 ；逼 → 比 ；残 → 参", lv: 3 },
      { safe: "特么的苟曰傻B，给我衮", orig: "他妈的狗日傻逼，给我滚", op: "他妈 → 特么 ；狗 → 苟 ；日 → 曰 ；逼 → B ；滚 → 衮", lv: 3 },
      { safe: "草你全家上下十八代", orig: "操你全家上下十八代", op: "操 → 草", lv: 3 },
      { safe: "尼玛的吊，被苟曰了吧", orig: "你妈的屌，被狗日了吧", op: "你妈 → 尼玛 ；屌 → 吊 ；狗 → 苟 ；日 → 曰", lv: 3 },
      { safe: "你这个杂仲畜牲，草你马", orig: "你这个杂种畜生，操你妈", op: "种 → 仲 ；畜生 → 畜牲 ；操 → 草 ；妈 → 马", lv: 3 },
      { safe: "我搓死你这个沙比", orig: "我操死你这个傻逼", op: "操 → 搓 ；傻 → 沙 ；逼 → 比", lv: 3 },
      { safe: "去你马的4吧，废五一个", orig: "去你妈的死吧，废物一个", op: "妈 → 马 ；死 → 4 ；废物 → 废五", lv: 3 },
      { safe: "曹尼玛比的，全家都该曰", orig: "操你妈逼的，全家都该日", op: "操 → 曹 ；你妈 → 尼玛 ；逼 → 比 ；日 → 曰", lv: 3 },
      { safe: "你马被草烂的表子", orig: "你妈被操烂的婊子", op: "妈 → 马 ；操 → 草 ；婊 → 表", lv: 3 },
      { safe: "沙比，草你马的臭比穴", orig: "傻逼，操你妈的臭逼穴", op: "傻 → 沙 ；逼 → 比 ；操 → 草 ；妈 → 马", lv: 3 },
      { safe: "我曰你仙人，你全家埋一起", orig: "我日你仙人，你全家埋一起", op: "日 → 曰", lv: 3 }
    ];

    /* ==================== 工具函数 ==================== */
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      }
    }

    /* ==================== 随机一句逻辑 ==================== */
    let currentLv = 0;
    let pool = [];
    let idx = 0;
    let viewed = new Set();

    function rebuildPool() {
      pool = currentLv === 0 ? DATA.slice() : DATA.filter(d => d.lv === currentLv);
      // 打乱
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      idx = 0;
      viewed.clear();
    }

    function renderLevelTag(lv) {
      const names = { 2: "大杯", 3: "特大杯" };
      // 大杯亮2个点，特大杯亮3个点
      const dots = [1, 2, 3].map(i => {
        if (lv === 2) return `<span class="${i <= 2 ? "on" : ""}"></span>`;
        return `<span class="${i <= 3 ? "on" : ""}"></span>`;
      }).join("");
      document.getElementById("level-tag").innerHTML = `${names[lv] || ""} ${dots}`;
    }

    // 在字符之间插入零宽空格（U+200B），打断连续敏感词匹配
    function insertZeroWidth(str) {
      if (!str) return str;
      // 只在汉字/字母数字之间插入，避免标点前后乱插
      return str.split("").join("\u200b");
    }

    function showCurrent() {
      if (!pool.length) return;
      const item = pool[idx % pool.length];
      const useZw = document.getElementById("opt-zw-random")?.checked;
      const displaySafe = useZw ? insertZeroWidth(item.safe) : item.safe;
      document.getElementById("safe-text").textContent = displaySafe;
      document.getElementById("orig-text").textContent = item.orig;
      document.getElementById("op-text").textContent = "原词 → 形近：" + item.op + (useZw ? " ＋ 零宽字符" : "");
      renderLevelTag(item.lv);
      viewed.add(item.safe + item.orig);
      document.getElementById("counter").textContent = `已浏览 ${viewed.size} / ${pool.length} 句`;
      // 把当前可复制文本存一下，方便复制时带零宽
      window._currentSafe = displaySafe;
    }

    function roll() {
      if (!pool.length) rebuildPool();
      idx = (idx + 1) % pool.length;
      showCurrent();
    }

    /* ==================== 实时转换逻辑 ==================== */
    function convertText(raw, randomPick = true, useZw = true) {
      if (!raw.trim()) return "";

      // 按长度降序，优先匹配长词
      const keys = Object.keys(DICT).sort((a, b) => b.length - a.length);
      let result = raw;

      for (const key of keys) {
        const variants = DICT[key];
        if (!variants || !variants.length) continue;
        const re = new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        result = result.replace(re, () => {
          let rep = randomPick
            ? variants[Math.floor(Math.random() * variants.length)]
            : variants[0];
          if (useZw) rep = insertZeroWidth(rep);
          return rep;
        });
      }
      return result;
    }

    /* ==================== 事件绑定 ==================== */
    // Tab 切换
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
        tab.classList.add("on");
        const name = tab.dataset.tab;
        document.getElementById("panel-random").classList.toggle("off", name !== "random");
        document.getElementById("panel-convert").classList.toggle("on", name === "convert");
      });
    });

    // 强度筛选
    document.getElementById("level-filters").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
      chip.classList.add("on");
      currentLv = +chip.dataset.lv;
      rebuildPool();
      showCurrent();
    });

    document.getElementById("btn-roll").addEventListener("click", roll);
    document.getElementById("btn-copy").addEventListener("click", async () => {
      const text = window._currentSafe || document.getElementById("safe-text").textContent;
      const useZw = document.getElementById("opt-zw-random")?.checked;
      const ok = await copyText(text);
      toast(ok ? (useZw ? "已复制（含零宽字符）" : "已复制") : "复制失败，请手动选择");
    });

    // 零宽开关变化时刷新当前句子
    document.getElementById("opt-zw-random")?.addEventListener("change", () => {
      showCurrent();
    });

    document.getElementById("btn-convert").addEventListener("click", () => {
      const raw = document.getElementById("input-text").value;
      const random = document.getElementById("opt-random").checked;
      const useZw = document.getElementById("opt-zw").checked;
      const result = convertText(raw, random, useZw);
      document.getElementById("result-box").textContent = result || "（无内容）";
    });

    document.getElementById("btn-copy-result").addEventListener("click", async () => {
      const text = document.getElementById("result-box").textContent;
      if (!text || text === "转换结果会显示在这里" || text === "（无内容）") {
        toast("没有可复制的内容");
        return;
      }
      const ok = await copyText(text);
      toast(ok ? "已复制结果" : "复制失败");
    });

    // 输入时实时转换（可选体验）
    let convertTimer;
    document.getElementById("input-text").addEventListener("input", () => {
      clearTimeout(convertTimer);
      convertTimer = setTimeout(() => {
        document.getElementById("btn-convert").click();
      }, 280);
    });

    // 键盘快捷键（仅在随机页）
    document.addEventListener("keydown", e => {
      if (document.getElementById("panel-convert").classList.contains("on")) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.code === "Space") {
        e.preventDefault();
        roll();
      }
      if (e.key === "c" || e.key === "C") {
        document.getElementById("btn-copy").click();
      }
    });

    // 初始化
    rebuildPool();
    showCurrent();
  </script>
</body>
</html>
